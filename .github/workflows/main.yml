name: Build ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install BLE Keyboard Library
        run: |
          mkdir -p ~/.arduino15/libraries
          git clone https://github.com/T-vK/ESP32-BLE-Keyboard.git ~/.arduino15/libraries/ESP32-BLE-Keyboard

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir ./build setir-bussid-wan.ino

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: ./build/*.bin
