name: Build ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Esptool
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install Esptool
        run: pip install esptool

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Core (v2.0.14)
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@2.0.14 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install BLE Keyboard Library
        run: |
          mkdir -p ~/Arduino/libraries
          git clone https://github.com/T-vK/ESP32-BLE-Keyboard.git ~/Arduino/libraries/ESP32-BLE-Keyboard

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --libraries ~/Arduino/libraries --output-dir ./build setir-bussid-wan.ino

      - name: Merge Binaries to One File (0x0)
        run: |
          esptool.py --chip esp32c3 merge_bin \
            -o ./build/merged.bin \
            --flash_mode dio \
            --flash_size 4MB \
            0x0 ./build/setir-bussid-wan.ino.bootloader.bin \
            0x8000 ./build/setir-bussid-wan.ino.partitions.bin \
            0x10000 ./build/setir-bussid-wan.ino.bin

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: ./build/merged.bin
